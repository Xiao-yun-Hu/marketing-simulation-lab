<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Marketing Simulation Lab</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-589QHZSK1R"></script>
<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}
gtag('js',new Date());gtag('config','G-589QHZSK1R');

// A/B entry point: assigns each visitor to variant A (digital world) or variant B
// (decision scanner) on first visit, remembers the choice in localStorage so repeat
// visits stay on the same version, and redirects there. Both variants also remain
// directly reachable at /a/ and /scanner/ for manual link-sharing or for checking a
// specific version yourself — visiting either of those URLs directly never goes
// through this assignment logic, so that traffic doesn't skew the experiment.
(function(){
  const KEY='msl_experiment_variant';
  const params=new URLSearchParams(location.search);
  const override=params.get('v'); // ?v=a or ?v=b — manual/dev preview, not counted as a real exposure
  let variant=override;
  let isNewAssignment=false;

  if(!variant){
    try{ variant=localStorage.getItem(KEY); }catch(e){}
  }
  if(variant!=='a'&&variant!=='b'){
    variant=Math.random()<0.5?'a':'b';
    isNewAssignment=true;
  }
  if(!override){
    try{ localStorage.setItem(KEY,variant); }catch(e){}
    gtag('event','experiment_exposure',{experiment_variant:variant,is_new_assignment:isNewAssignment});
  }

  const dest=(variant==='a'?'a/':'scanner/')+location.search;
  location.replace(dest);
})();
</script>
</head>
<body></body>
</html>
